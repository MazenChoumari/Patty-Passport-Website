<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap">
<link rel="stylesheet" href="_ds/modernist-cf9009e6-65ae-4cc3-81bb-0a0e3ffc9a69/styles.css">
<style>
@keyframes ppNavBlink{0%,55%{opacity:1}56%,100%{opacity:.15}}
@keyframes ppNavEq{0%{height:14%}100%{height:100%}}
@keyframes ppNavFade{from{opacity:0}to{opacity:1}}
</style></helmet>

<div data-nav-root="1" style="position:fixed;top:0;left:0;right:0;z-index:80;background:#f7f3ec;border-bottom:2px solid #1b1a19;font-family:'Archivo',system-ui,sans-serif">
  <div style="display:flex;align-items:center;justify-content:space-between;gap:18px;padding:11px 26px">
    <a href="Patty Passport Home.dc.html" style="display:flex;align-items:center;gap:13px;text-decoration:none;color:#1b1a19;flex:none">
      <span style="position:relative;width:44px;height:44px;flex:none;background:#1b1a19;display:block">
        <span style="position:absolute;left:4px;top:4px;right:4px;bottom:4px;border:2px solid #f7f3ec;display:block"></span>
        <span style="position:absolute;left:9px;top:9px;width:26px;height:8px;background:#f2b30c;display:block"></span>
        <span style="position:absolute;left:13px;top:11px;width:3px;height:3px;background:#1b1a19;display:block"></span>
        <span style="position:absolute;left:20px;top:11px;width:3px;height:3px;background:#1b1a19;display:block"></span>
        <span style="position:absolute;left:27px;top:11px;width:3px;height:3px;background:#1b1a19;display:block"></span>
        <span style="position:absolute;left:9px;top:19px;width:26px;height:3px;background:#f7f3ec;display:block"></span>
        <span style="position:absolute;left:9px;top:23px;width:26px;height:6px;background:#ec3013;display:block"></span>
        <span style="position:absolute;left:9px;top:30px;width:26px;height:6px;background:#f2b30c;display:block"></span>
        <span style="position:absolute;right:-7px;bottom:-7px;width:20px;height:20px;border:2px solid #ec3013;background:#f7f3ec;display:flex;align-items:center;justify-content:center;font:800 8px/1 'Archivo',sans-serif;color:#ec3013;transform:rotate(-12deg)">21</span>
      </span>
      <span>
        <span style="display:block;font:800 17px/1 'Archivo',sans-serif;letter-spacing:-.02em">PATTY PASSPORT</span>
        <span style="display:block;font:600 8.5px/1.5 'Archivo',sans-serif;letter-spacing:.17em;text-transform:uppercase;color:#7d7979">Order the Mediterranean to your table</span>
      </span>
    </a>
    <div style="display:flex;align-items:center;gap:10px;flex:none;margin-left:auto">
      <button type="button" onClick="{{ toggleMusic }}" style="display:inline-flex;align-items:center;gap:9px;padding:9px 12px;border:2px solid #1b1a19;background:transparent;color:#1b1a19;font:800 10px/1 'Archivo',sans-serif;letter-spacing:.13em;text-transform:uppercase;cursor:pointer;white-space:nowrap" style-hover="background:#f2b30c;border-color:#f2b30c">
        <sc-if value="{{ musicOn }}" hint-placeholder-val="{{ false }}">
          <span style="display:flex;align-items:flex-end;gap:2px;height:12px;width:14px">
            <span style="flex:1;background:#ec3013;height:40%;animation:ppNavEq .62s ease-in-out infinite alternate"></span>
            <span style="flex:1;background:#ec3013;height:80%;animation:ppNavEq .48s ease-in-out .1s infinite alternate"></span>
            <span style="flex:1;background:#ec3013;height:55%;animation:ppNavEq .74s ease-in-out .2s infinite alternate"></span>
          </span>
        </sc-if>
        <sc-if value="{{ musicOff }}" hint-placeholder-val="{{ true }}">
          <span style="width:0;height:0;border-left:9px solid currentColor;border-top:6px solid transparent;border-bottom:6px solid transparent"></span>
        </sc-if>
        {{ musicLabel }}
      </button>
      <a href="My-Passport.dc.html" style="display:inline-flex;align-items:center;gap:8px;padding:10px 14px;background:#1b1a19;color:#f7f3ec;text-decoration:none;font:800 10.5px/1 'Archivo',sans-serif;letter-spacing:.13em;text-transform:uppercase;white-space:nowrap" style-hover="background:#ec3013">My Passport</a>
      <button type="button" onClick="{{ openDrawer }}" style="display:inline-flex;align-items:center;gap:10px;padding:10px 13px;background:transparent;border:2px solid #1b1a19;color:#1b1a19;font:800 10.5px/1 'Archivo',sans-serif;letter-spacing:.13em;text-transform:uppercase;cursor:pointer" style-hover="background:#f2b30c;border-color:#f2b30c" style-active="background:#ec3013;border-color:#ec3013;color:#fff">
        <span style="display:block;width:16px">
          <span style="display:block;height:2px;background:currentColor;margin-bottom:3px"></span>
          <span style="display:block;height:2px;background:currentColor;margin-bottom:3px"></span>
          <span style="display:block;height:2px;background:currentColor"></span>
        </span>All pages
      </button>
    </div>
  </div>
  <div style="display:flex;align-items:center;gap:14px;padding:9px 26px;border-top:2px solid rgba(27,26,25,.16);overflow:hidden">
    <span style="font:600 9px/1 'Archivo',sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#7d7979;flex:none">Quick gates</span>
    <div style="display:flex;align-items:center;gap:8px;min-width:0;opacity:{{ gateOpacity }};transition:opacity .24s ease">
      <sc-for list="{{ gates }}" as="g" hint-placeholder-count="4">
        <a href="{{ g.href }}" style="display:inline-flex;align-items:center;gap:7px;padding:8px 11px;border:2px solid {{ g.border }};background:{{ g.bg }};text-decoration:none;color:{{ g.fg }};font:600 10px/1 'Archivo',sans-serif;letter-spacing:.13em;text-transform:uppercase;white-space:nowrap" style-hover="border-color:#ec3013;color:#ec3013">
          <span style="width:6px;height:6px;flex:none;background:{{ g.dot }}"></span>{{ g.label }}
        </a>
      </sc-for>
    </div>
    <span style="margin-left:auto;flex:none;font:600 9px/1 'Archivo',sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#7d7979">{{ gatePageLabel }}</span>
  </div>
  <sc-if value="{{ musicOn }}" hint-placeholder-val="{{ false }}">
    <div style="display:flex;align-items:center;gap:12px;padding:8px 26px;background:#1b1a19;color:#f7f3ec;font:600 9.5px/1 'Archivo',sans-serif;letter-spacing:.16em;text-transform:uppercase">
      <span style="width:7px;height:7px;background:#f2b30c;animation:ppNavBlink 1.3s steps(1) infinite"></span>
      Now playing · Beirut Corniche, 7pm — Levant Route
      <span style="margin-left:auto;color:#bab6b6">42 tracks</span>
    </div>
  </sc-if>
  <div style="position:relative;height:5px;background:rgba(27,26,25,.14)">
    <div data-nav-fill="1" style="position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#ec3013,#f2b30c)"></div>
    <div data-nav-plane="1" style="position:absolute;top:-11px;left:0;width:26px;height:26px;color:#1b1a19">
      <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M17.8 19.2 16 11l3.5-3.5a2.1 2.1 0 0 0-3-3L13 8 4.8 6.2a.5.5 0 0 0-.5.8l3.9 4.2-2.1 2.1-2.1-.4a.5.5 0 0 0-.5.8l2 2 2 2a.5.5 0 0 0 .8-.5l-.4-2.1 2.1-2.1 4.2 3.9a.5.5 0 0 0 .8-.5Z" fill="#f7f3ec"></path></svg>
    </div>
  </div>
</div>

<sc-if value="{{ drawerOpen }}" hint-placeholder-val="{{ false }}">
  <div style="position:fixed;inset:0;z-index:90;display:flex;justify-content:flex-end;font-family:'Archivo',system-ui,sans-serif">
    <div onClick="{{ closeDrawer }}" style="position:absolute;inset:0;background:rgba(27,26,25,.62);animation:ppNavFade .22s ease both"></div>
    <div style="position:relative;width:min(430px,90vw);height:100%;background:#1b1a19;color:#f7f3ec;border-left:2px solid #1b1a19;overflow-y:auto;transform:{{ drawerX }};opacity:{{ drawerAlpha }};transition:transform .32s cubic-bezier(.2,.85,.25,1),opacity .28s ease">
      <div style="display:flex;align-items:center;justify-content:space-between;padding:20px 24px;border-bottom:2px solid rgba(247,243,236,.3)">
        <span style="font:800 11px/1 'Archivo',sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#f2b30c">Terminal directory</span>
        <button type="button" onClick="{{ closeDrawer }}" style="background:transparent;border:2px solid rgba(247,243,236,.5);color:#f7f3ec;font:800 11px/1 'Archivo',sans-serif;letter-spacing:.14em;padding:9px 12px;cursor:pointer" style-hover="background:#ec3013;border-color:#ec3013">CLOSE ✕</button>
      </div>
      <sc-for list="{{ drawerLinks }}" as="d" hint-placeholder-count="11">
        <a href="{{ d.href }}" style="display:flex;align-items:baseline;gap:14px;padding:18px 24px;border-bottom:1px solid rgba(247,243,236,.22);text-decoration:none;color:{{ d.fg }};background:{{ d.bg }}" style-hover="background:#ec3013;color:#fff">
          <span style="font:600 10px/1 'Archivo',sans-serif;letter-spacing:.16em;color:#f2b30c;width:28px;flex:none">{{ d.n }}</span>
          <span style="flex:1">
            <span style="display:block;font:800 19px/1.1 'Archivo',sans-serif;letter-spacing:-.02em">{{ d.title }}</span>
            <span style="display:block;font:400 12px/1.45 'Archivo',sans-serif;color:#bab6b6;margin-top:3px">{{ d.sub }}</span>
          </span>
          <span style="font:800 15px/1 'Archivo',sans-serif">→</span>
        </a>
      </sc-for>
      <div style="padding:22px 24px;font:400 12px/1.6 'Archivo',sans-serif;color:#bab6b6">Leganés · Madrid<br>Open daily 12:00 — 00:00</div>
    </div>
  </div>
</sc-if>
<div data-nav-spacer="1" style="height:136px"></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;active&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
const PAGES = [
  ["01", "Destinations", "All 21 countries, route by route", "Destinations.dc.html"],
  ["02", "Route map", "The Mediterranean network", "Route-Map.dc.html"],
  ["03", "Menu", "Every dish, by destination", "Menu.dc.html"],
  ["04", "Rewards & passport", "Stamps, ladder, unlockables", "Rewards.dc.html"],
  ["05", "Events & birthdays", "Celebrations on any route", "Events.dc.html"],
  ["06", "Junior explorers", "Kits, booklets, kids routes", "Junior-Explorers.dc.html"],
  ["07", "Our story", "Why Patty Passport exists", "Our-Story.dc.html"],
  ["08", "Ask Patty Tooty", "The destination concierge", "Patty-Tooty.dc.html"],
  ["09", "Investors", "Steer the next route", "Investors.dc.html"],
  ["10", "My passport", "Stamps, rewards, bookings", "My-Passport.dc.html"],
  ["11", "Book a table", "Choose time, route and destination", "Booking.dc.html"],
  ["12", "Home terminal", "The full journey, top to bottom", "Patty Passport Home.dc.html"]
];
const GATES = [
  ["Destinations", "Destinations.dc.html", "#ec3013"],
  ["Route map", "Route-Map.dc.html", "#2b76c9"],
  ["Menu", "Menu.dc.html", "#f2b30c"],
  ["Rewards", "Rewards.dc.html", "#ec3013"],
  ["Events", "Events.dc.html", "#f2b30c"],
  ["Kids", "Junior-Explorers.dc.html", "#2b76c9"],
  ["Story", "Our-Story.dc.html", "#ec3013"],
  ["Patty Tooty", "Patty-Tooty.dc.html", "#f2b30c"],
  ["Investors", "Investors.dc.html", "#ec3013"],
  ["Book", "Booking.dc.html", "#ec3013"]
];

class Component extends DCLogic {
  state = { drawerOpen: false, drawerIn: false, musicOn: false, gatePage: 0, gateFade: 1 };

  componentDidMount() {
    const fill = document.querySelector("[data-nav-fill]");
    const plane = document.querySelector("[data-nav-plane]");
    this._raf = null;
    const tick = () => {
      this._raf = null;
      const max = Math.max(1, document.documentElement.scrollHeight - window.innerHeight);
      const p = Math.min(1, Math.max(0, window.scrollY / max));
      if (fill) fill.style.width = (p * 100) + "%";
      if (plane) plane.style.left = "calc(" + (p * 100) + "% - 13px)";
    };
    this._onScroll = () => { if (!this._raf) this._raf = requestAnimationFrame(tick); };
    this._onKey = e => { if (e.key === "Escape") this.setState({ drawerOpen: false, drawerIn: false }); };
    window.addEventListener("scroll", this._onScroll, { passive: true });
    window.addEventListener("resize", this._onScroll);
    window.addEventListener("keydown", this._onKey);
    tick();

    // Drive spacer, sticky offsets and anchor landings from the real nav height.
    const root = document.querySelector("[data-nav-root]");
    const spacer = document.querySelector("[data-nav-spacer]");
    const sync = () => {
      if (!root) return;
      const h = Math.ceil(root.getBoundingClientRect().height);
      if (h === this._navH) return;
      this._navH = h;
      if (spacer) spacer.style.height = h + "px";
      document.documentElement.style.setProperty("--pp-nav-h", h + "px");
      document.querySelectorAll("[data-sticky-under-nav]").forEach(el => { el.style.top = h + "px"; });
      document.querySelectorAll("section").forEach(el => { el.style.scrollMarginTop = (h + 20) + "px"; });
    };
    this._sync = sync;
    sync();
    this._syncPoll = setInterval(sync, 350);
    if (window.ResizeObserver && root) {
      this._ro = new ResizeObserver(sync);
      this._ro.observe(root);
    }

    this._gateTimer = setInterval(() => {
      this.setState({ gateFade: 0 });
      setTimeout(() => this.setState(s => ({ gatePage: s.gatePage + 1, gateFade: 1 })), 260);
    }, 4200);
  }
  componentWillUnmount() {
    window.removeEventListener("scroll", this._onScroll);
    window.removeEventListener("resize", this._onScroll);
    window.removeEventListener("keydown", this._onKey);
    clearInterval(this._gateTimer);
    clearInterval(this._syncPoll);
    if (this._ro) this._ro.disconnect();
  }

  componentDidUpdate() { if (this._sync) this._sync(); }

  renderVals() {
    const active = this.props.active || "";
    const per = 4, pages = Math.ceil(GATES.length / per);
    const activeIdx = GATES.findIndex(g => g[0] === active);
    const homePage = activeIdx > -1 ? Math.floor(activeIdx / per) : 0;
    const pg = (homePage + this.state.gatePage) % pages;
    return {
      gateOpacity: String(this.state.gateFade),
      gatePageLabel: "Gate " + (pg + 1) + " / " + pages,
      gates: GATES.slice(pg * per, pg * per + per).map(g => ({
        label: g[0], href: g[1], dot: g[2],
        bg: active === g[0] ? "#1b1a19" : "transparent",
        fg: active === g[0] ? "#f7f3ec" : "#1b1a19",
        border: active === g[0] ? "#1b1a19" : "rgba(27,26,25,.2)"
      })),
      drawerLinks: PAGES.map(p => ({
        n: p[0], title: p[1], sub: p[2], href: p[3],
        bg: active === p[1] ? "rgba(242,179,12,.14)" : "transparent",
        fg: "#f7f3ec"
      })),
      drawerOpen: this.state.drawerOpen,
      drawerX: this.state.drawerIn ? "translateX(0)" : "translateX(16px)",
      drawerAlpha: this.state.drawerIn ? "1" : "0.35",
      openDrawer: () => {
        this.setState({ drawerOpen: true, drawerIn: false });
        setTimeout(() => this.setState({ drawerIn: true }), 20);
      },
      closeDrawer: () => this.setState({ drawerOpen: false, drawerIn: false }),
      musicOn: this.state.musicOn,
      musicOff: !this.state.musicOn,
      musicLabel: this.state.musicOn ? "Playing" : "Play the Mediterranean",
      toggleMusic: () => this.setState(s => ({ musicOn: !s.musicOn }))
    };
  }
}
</script>
</body>
</html>
