name: Sync site to docs

# GitHub Pages ("Deploy from a branch") can only publish from the repo root
# or a /docs folder, not from /site where the real source lives. This
# workflow keeps /docs as a plain mirror of /site so editing files under
# /site and pushing to main is all that's needed to update the live site.
on:
  push:
    branches: [main]
    paths:
      - "site/**"

permissions:
  contents: write

concurrency:
  group: sync-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mirror site/ into docs/
        run: |
          rm -rf docs
          mkdir -p docs
          rsync -a --exclude 'CONVENTIONS.md' site/ docs/
          touch docs/.nojekyll

      - name: Commit and push if docs changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "docs/ already up to date, nothing to commit."
            exit 0
          fi
          git commit -m "chore: sync docs/ from site/ [skip ci]"
          git push origin HEAD:main
